name: tradepulse

# ---------------------------------------------------------------------------
# Single-URL production deployment.
#
# Unlike infra/docker-compose.yml (which publishes every service on its own
# host port for local development), this file publishes ONLY the dashboard.
# The dashboard container runs nginx and reverse-proxies the backend APIs:
#
#     http://<host>:${PUBLIC_PORT:-80}/            -> React SPA
#     http://<host>:${PUBLIC_PORT:-80}/ledger/...  -> ledger-core:8082
#     http://<host>:${PUBLIC_PORT:-80}/risk/...    -> risk-engine:8083
#     http://<host>:${PUBLIC_PORT:-80}/stream      -> gateway:8084 (SSE)
#
# Every other service is reachable only on the internal compose network, so the
# whole platform is accessed through the one public URL.
#
# Usage:
#   docker compose -f infra/docker-compose.deploy.yml up --build -d
#   # then open http://<host>:${PUBLIC_PORT:-80}/
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradepulse}
      POSTGRES_DB: ${POSTGRES_DB:-tradepulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradepulse} -d ${POSTGRES_DB:-tradepulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  market-data:
    build:
      context: ../services
      dockerfile: market-data/Dockerfile
    environment:
      PORT: "8081"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_ADDR: "redis:6379"
      MARKET_DATA_STREAM: ${MARKET_DATA_STREAM:-market.ticks}
      MARKET_DATA_SYMBOLS: ${MARKET_DATA_SYMBOLS:-AAPL,MSFT,GOOG}
      MARKET_DATA_TICK_INTERVAL_MS: ${MARKET_DATA_TICK_INTERVAL_MS:-1000}
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-synthetic}
    expose:
      - "8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ledger-core:
    build:
      context: ../services/ledger-core
    environment:
      SERVER_PORT: "8082"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tradepulse}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tradepulse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tradepulse}
      REDIS_URL: "redis://redis:6379/0"
      # Enable the ledger.updates stream so risk metrics populate automatically.
      LEDGER_STREAM_ENABLED: ${LEDGER_STREAM_ENABLED:-true}
      LEDGER_STREAM_NAME: ${LEDGER_STREAM_NAME:-ledger.updates}
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8082'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  risk-engine:
    build:
      context: ../services/risk-engine
    environment:
      PORT: "8083"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-tradepulse}:${POSTGRES_PASSWORD:-tradepulse}@postgres:5432/${POSTGRES_DB:-tradepulse}"
      RISK_DB_PATH: ${RISK_DB_PATH:-/app/data/risk_state.db}
    expose:
      - "8083"
    volumes:
      - risk_state:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8083/health').status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Dedicated risk stream consumer: reads ledger.updates + market.ticks and
  # publishes risk.updates, persisting the durable projection to the shared
  # risk_state volume. Running this makes the Risk page populate automatically.
  risk-worker:
    build:
      context: ../services/risk-engine
    command: ["python", "-m", "app.worker"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: "redis://redis:6379/0"
      RISK_DB_PATH: ${RISK_DB_PATH:-/app/data/risk_state.db}
    volumes:
      - risk_state:/app/data
    depends_on:
      redis:
        condition: service_healthy
      ledger-core:
        condition: service_started
    restart: unless-stopped

  gateway:
    build:
      context: ../services
      dockerfile: gateway/Dockerfile
    environment:
      PORT: "8084"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_ADDR: "redis:6379"
    expose:
      - "8084"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The ONLY publicly published service: the single front-door URL.
  dashboard:
    build:
      context: ../services/dashboard
    ports:
      - "${PUBLIC_PORT:-80}:3000"
    depends_on:
      ledger-core:
        condition: service_started
      risk-engine:
        condition: service_started
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  risk_state:
