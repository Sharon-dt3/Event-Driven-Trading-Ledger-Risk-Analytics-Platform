name: tradepulse

# ---------------------------------------------------------------------------
# PUBLIC deployment (HTTPS, internet-reachable).
#
# Difference vs docker-compose.deploy.yml:
#   - A Caddy reverse proxy is the ONLY published service (ports 80 + 443) and
#     terminates TLS (automatic Let's Encrypt certificate for ${DOMAIN}).
#   - The dashboard is NOT published on the host; Caddy reaches it internally.
#   - Strong secrets are REQUIRED via ${VAR:?...}. Compose refuses to start if
#     they are missing, so you cannot accidentally expose the app to the
#     internet with the in-repo demo credentials or the dev JWT secret.
#
# Required environment (put these in infra/.env):
#   DOMAIN                        public hostname, e.g. tradepulse.example.com
#   LEDGER_JWT_SECRET             long random string (>= 32 chars)
#   LEDGER_AUTH_ADMIN_PASSWORD    strong admin password
#   LEDGER_AUTH_TRADER_PASSWORD   strong trader password
#   LEDGER_AUTH_VIEWER_PASSWORD   strong viewer password
#   LEDGER_AUTH_COMPLIANCE_PASSWORD strong compliance password
#   POSTGRES_PASSWORD             strong database password
# Optional:
#   ACME_EMAIL                    email for Let's Encrypt expiry notices
#
# Usage:
#   docker compose -f infra/docker-compose.public.yml up --build -d
#   # then open https://${DOMAIN}/
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD for public deploy}
      POSTGRES_DB: ${POSTGRES_DB:-tradepulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradepulse} -d ${POSTGRES_DB:-tradepulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  market-data:
    build:
      context: ../services
      dockerfile: market-data/Dockerfile
    environment:
      PORT: "8081"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_ADDR: "redis:6379"
      MARKET_DATA_STREAM: ${MARKET_DATA_STREAM:-market.ticks}
      MARKET_DATA_SYMBOLS: ${MARKET_DATA_SYMBOLS:-AAPL,MSFT,GOOG}
      MARKET_DATA_TICK_INTERVAL_MS: ${MARKET_DATA_TICK_INTERVAL_MS:-1000}
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-synthetic}
    expose:
      - "8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ledger-core:
    build:
      context: ../services/ledger-core
    environment:
      SERVER_PORT: "8082"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tradepulse}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tradepulse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD for public deploy}
      REDIS_URL: "redis://redis:6379/0"
      LEDGER_STREAM_ENABLED: ${LEDGER_STREAM_ENABLED:-true}
      LEDGER_STREAM_NAME: ${LEDGER_STREAM_NAME:-ledger.updates}
      # --- Security: required for public exposure ---
      LEDGER_JWT_SECRET: ${LEDGER_JWT_SECRET:?set a strong random LEDGER_JWT_SECRET (>=32 chars)}
      LEDGER_AUTH_ADMIN_PASSWORD: ${LEDGER_AUTH_ADMIN_PASSWORD:?set a strong LEDGER_AUTH_ADMIN_PASSWORD}
      LEDGER_AUTH_TRADER_PASSWORD: ${LEDGER_AUTH_TRADER_PASSWORD:?set a strong LEDGER_AUTH_TRADER_PASSWORD}
      LEDGER_AUTH_VIEWER_PASSWORD: ${LEDGER_AUTH_VIEWER_PASSWORD:?set a strong LEDGER_AUTH_VIEWER_PASSWORD}
      LEDGER_AUTH_COMPLIANCE_PASSWORD: ${LEDGER_AUTH_COMPLIANCE_PASSWORD:?set a strong LEDGER_AUTH_COMPLIANCE_PASSWORD}
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8082'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  risk-engine:
    build:
      context: ../services/risk-engine
    environment:
      PORT: "8083"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-tradepulse}:${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD for public deploy}@postgres:5432/${POSTGRES_DB:-tradepulse}"
      RISK_DB_PATH: ${RISK_DB_PATH:-/app/data/risk_state.db}
    expose:
      - "8083"
    volumes:
      - risk_state:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8083/health').status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  risk-worker:
    build:
      context: ../services/risk-engine
    command: ["python", "-m", "app.worker"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: "redis://redis:6379/0"
      RISK_DB_PATH: ${RISK_DB_PATH:-/app/data/risk_state.db}
    volumes:
      - risk_state:/app/data
    depends_on:
      redis:
        condition: service_healthy
      ledger-core:
        condition: service_started
    restart: unless-stopped

  gateway:
    build:
      context: ../services
      dockerfile: gateway/Dockerfile
    environment:
      PORT: "8084"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_ADDR: "redis:6379"
    expose:
      - "8084"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Internal only: reached by Caddy, not published on the host.
  dashboard:
    build:
      context: ../services/dashboard
    expose:
      - "3000"
    depends_on:
      ledger-core:
        condition: service_started
      risk-engine:
        condition: service_started
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The ONLY publicly published service: TLS termination + single public URL.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your public hostname, e.g. tradepulse.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  risk_state:
  caddy_data:
  caddy_config:
