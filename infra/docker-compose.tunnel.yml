name: tradepulse

# ---------------------------------------------------------------------------
# PUBLIC deployment via Cloudflare Tunnel (no domain / public IP required).
#
# This is the easiest way to let ANYONE on the internet reach the app from a
# laptop or any machine behind NAT/home Wi-Fi. A `cloudflared` container opens
# an outbound tunnel to Cloudflare and receives a public HTTPS URL of the form
#   https://<random-words>.trycloudflare.com
# which proxies to the internal dashboard (the single front-door that already
# routes /ledger, /risk, and /stream to the backends).
#
# No ports are published on the host, no firewall/router changes, and TLS is
# handled by Cloudflare. The URL is printed in the cloudflared logs:
#   make tunnel-url        # prints the public https URL once it's ready
#
# SECURITY: because the URL is world-reachable, set strong app credentials in
# infra/.env before sharing it:
#   LEDGER_JWT_SECRET, LEDGER_AUTH_ADMIN_PASSWORD, LEDGER_AUTH_TRADER_PASSWORD,
#   LEDGER_AUTH_VIEWER_PASSWORD, LEDGER_AUTH_COMPLIANCE_PASSWORD, POSTGRES_PASSWORD
# The defaults below match the repo demo values so it runs out of the box, but
# anyone who knows those public demo passwords could log in until you change them.
#
# Usage:
#   docker compose -f infra/docker-compose.tunnel.yml up --build -d
#   make tunnel-url
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradepulse}
      POSTGRES_DB: ${POSTGRES_DB:-tradepulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradepulse} -d ${POSTGRES_DB:-tradepulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  market-data:
    build:
      context: ../services
      dockerfile: market-data/Dockerfile
    environment:
      PORT: "8081"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_ADDR: "redis:6379"
      MARKET_DATA_STREAM: ${MARKET_DATA_STREAM:-market.ticks}
      MARKET_DATA_SYMBOLS: ${MARKET_DATA_SYMBOLS:-AAPL,MSFT,GOOG}
      MARKET_DATA_TICK_INTERVAL_MS: ${MARKET_DATA_TICK_INTERVAL_MS:-1000}
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-synthetic}
    expose:
      - "8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ledger-core:
    build:
      context: ../services/ledger-core
    environment:
      SERVER_PORT: "8082"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tradepulse}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tradepulse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tradepulse}
      REDIS_URL: "redis://redis:6379/0"
      LEDGER_STREAM_ENABLED: ${LEDGER_STREAM_ENABLED:-true}
      LEDGER_STREAM_NAME: ${LEDGER_STREAM_NAME:-ledger.updates}
      # Security overrides — set these in infra/.env before sharing the URL.
      LEDGER_JWT_SECRET: ${LEDGER_JWT_SECRET:-change-me-tradepulse-ledger-dev-secret-please-rotate}
      LEDGER_AUTH_ADMIN_PASSWORD: ${LEDGER_AUTH_ADMIN_PASSWORD:-admin-pw}
      LEDGER_AUTH_TRADER_PASSWORD: ${LEDGER_AUTH_TRADER_PASSWORD:-trader-pw}
      LEDGER_AUTH_VIEWER_PASSWORD: ${LEDGER_AUTH_VIEWER_PASSWORD:-viewer-pw}
      LEDGER_AUTH_COMPLIANCE_PASSWORD: ${LEDGER_AUTH_COMPLIANCE_PASSWORD:-compliance-pw}
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8082'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  risk-engine:
    build:
      context: ../services/risk-engine
    environment:
      PORT: "8083"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-tradepulse}:${POSTGRES_PASSWORD:-tradepulse}@postgres:5432/${POSTGRES_DB:-tradepulse}"
      RISK_DB_PATH: ${RISK_DB_PATH:-/app/data/risk_state.db}
    expose:
      - "8083"
    volumes:
      - risk_state:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8083/health').status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  risk-worker:
    build:
      context: ../services/risk-engine
    command: ["python", "-m", "app.worker"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: "redis://redis:6379/0"
      RISK_DB_PATH: ${RISK_DB_PATH:-/app/data/risk_state.db}
    volumes:
      - risk_state:/app/data
    depends_on:
      redis:
        condition: service_healthy
      ledger-core:
        condition: service_started
    restart: unless-stopped

  gateway:
    build:
      context: ../services
      dockerfile: gateway/Dockerfile
    environment:
      PORT: "8084"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_ADDR: "redis:6379"
    expose:
      - "8084"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Internal only: reached by cloudflared, not published on the host.
  dashboard:
    build:
      context: ../services/dashboard
    expose:
      - "3000"
    depends_on:
      ledger-core:
        condition: service_started
      risk-engine:
        condition: service_started
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cloudflare quick tunnel: outbound-only, gives a public https URL that
  # proxies to the dashboard. No account, domain, or open ports required.
  # The public URL is printed in this container's logs (see `make tunnel-url`).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://dashboard:3000"]
    depends_on:
      dashboard:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  risk_state:
