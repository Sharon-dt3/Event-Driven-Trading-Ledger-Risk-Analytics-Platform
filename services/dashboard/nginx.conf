server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; using a variable upstream defers name resolution to
    # request time so nginx boots even if a backend isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"dashboard"}';
    }

    # Ledger REST (strip the /ledger base path before forwarding).
    location /ledger/ {
        set $ledger_upstream ledger-core:8082;
        rewrite ^/ledger/(.*)$ /$1 break;
        proxy_pass http://$ledger_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Risk REST (paths are served literally as /risk/...).
    location /risk/ {
        set $risk_upstream risk-engine:8083;
        proxy_pass http://$risk_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Gateway SSE realtime feed (streaming: disable buffering, long read timeout).
    location /stream {
        set $gateway_upstream gateway:8084;
        proxy_pass http://$gateway_upstream/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
