# Offline test datasource: H2 in PostgreSQL compatibility mode.
# Flyway runs the SAME db/migration scripts used against real Postgres, so the
# double-entry + idempotency invariants are proven without Docker.
spring.datasource.url=jdbc:h2:mem:ledger;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
