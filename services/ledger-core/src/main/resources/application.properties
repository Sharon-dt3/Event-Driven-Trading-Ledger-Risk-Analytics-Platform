spring.application.name=ledger-core
server.port=${SERVER_PORT:8082}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Phase 2: datasource + migrations (real Postgres via env in docker-compose).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tradepulse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tradepulse}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tradepulse}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Phase 4: JWT auth + compliance limits.
ledger.jwt.secret=${LEDGER_JWT_SECRET:change-me-tradepulse-ledger-dev-secret-please-rotate}
ledger.jwt.ttl-seconds=${LEDGER_JWT_TTL_SECONDS:3600}
ledger.max-position=${LEDGER_MAX_POSITION:1000000}

# Phase 5: Redis Streams publisher plumbing (wired, not yet driving anything).
spring.data.redis.url=${REDIS_URL:redis://localhost:6379/0}
ledger.stream.enabled=${LEDGER_STREAM_ENABLED:false}
ledger.stream.name=${LEDGER_STREAM_NAME:ledger.updates}
ledger.stream.poll-interval-ms=${LEDGER_STREAM_POLL_INTERVAL_MS:1000}
ledger.stream.batch-size=${LEDGER_STREAM_BATCH_SIZE:100}
